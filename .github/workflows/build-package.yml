name: Build Entware package

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu

          package_version=$(sed -n 's/^PKG_VERSION:=//p' net/router-watchdog/Makefile)
          tag_version=${GITHUB_REF_NAME#v}

          echo "Package version: $package_version"
          echo "Release tag:      $tag_version"

          test "$package_version" = "$tag_version" || {
            echo "Package version $package_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          }

      - name: Prepare Entware builder
        run: |
          set -eux

          rm -rf entware-docker

          git clone --depth 1 \
            https://github.com/Entware/docker.git \
            entware-docker

          cd entware-docker

          python3 - <<'PY'
          from pathlib import Path

          path = Path("Dockerfile")
          text = path.read_text()

          needle = "apt-get update && \\"

          replacement = """find /etc/apt -type f \\
            \\( -name '*.list' -o -name '*.sources' \\) \\
            -exec sed -i 's|deb.debian.org/debian-security|archive.debian.org/debian-security|g' {} + && \\
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until && \\
          apt-get update && \\"""

          if needle not in text:
              raise SystemExit(
                  "Expected Entware Dockerfile apt section was not found"
              )

          path.write_text(text.replace(needle, replacement, 1))
          PY

          echo "=== Patched Dockerfile ==="
          cat Dockerfile

          cd ..

          docker build \
            --pull \
            --tag entware-builder \
            ./entware-docker

      - name: Resolve Entware feed revisions
        id: entware-revisions
        run: |
          set -euo pipefail

          entware=$(git ls-remote https://github.com/Entware/Entware.git HEAD | cut -f1)
          packages=$(git ls-remote https://github.com/Entware/entware-packages.git HEAD | cut -f1)
          rustlang=$(git ls-remote https://github.com/Entware/entware-rust.git HEAD | cut -f1)

          test -n "$entware"
          test -n "$packages"
          test -n "$rustlang"

          echo "entware=$entware" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "rustlang=$rustlang" >> "$GITHUB_OUTPUT"

      - name: Restore Entware build cache
        id: entware-cache
        uses: actions/cache/restore@v4
        with:
          path: entware-cache.tar
          key: ${{ runner.os }}-entware-x64-3.2-${{ steps.entware-revisions.outputs.entware }}-${{ steps.entware-revisions.outputs.packages }}-${{ steps.entware-revisions.outputs.rustlang }}-${{ hashFiles('net/router-watchdog/Makefile', 'net/router-watchdog/files/**') }}

      - name: Create Entware build script
        run: |
          set -eux

          cat > build-entware.sh <<'SCRIPT'
          #!/bin/bash

          set -euxo pipefail

          echo "=== Start Entware build ==="

          cd /home/me

          rm -rf Entware

          echo "=== Clone Entware ==="

          git clone --depth 1 \
            https://github.com/Entware/Entware.git \
            Entware

          cd Entware

          save_build_cache() {
            build_status=$?
            trap - EXIT

            echo "=== Save Entware build cache archive ==="

            if tar -cf /workspace/entware-cache.tar \
              build_dir staging_dir dl; then
              chmod 644 /workspace/entware-cache.tar
            else
              echo "Failed to create Entware build cache archive" >&2
              exit 1
            fi

            exit "$build_status"
          }

          trap save_build_cache EXIT

          if [ -f /workspace/entware-cache.tar ]; then
            echo "=== Restore Entware build cache archive ==="
            tar -xf /workspace/entware-cache.tar
          fi

          echo "=== Entware revision ==="

          git rev-parse HEAD

          echo "=== Configure target ==="

          cp configs/x64-3.2.config .config

          echo "=== Add local router-watchdog feed ==="

          echo 'src-link router_watchdog /workspace/net' >> feeds.conf

          echo "=== feeds.conf ==="

          nl -ba feeds.conf

          echo "=== Update router-watchdog feed ==="

          ./scripts/feeds update router_watchdog

          echo "=== Install router-watchdog package definition ==="

          ./scripts/feeds install -p router_watchdog router-watchdog

          echo "=== Update packages feed ==="

          ./scripts/feeds update packages

          echo "=== Update rustlang feed ==="

          ./scripts/feeds update rustlang

          echo "=== Install python3 package definition ==="

          ./scripts/feeds install python3

          echo "=== Verify package symlink ==="

          test -L package/feeds/router_watchdog/router-watchdog

          ls -la package/feeds/router_watchdog/router-watchdog

          echo "=== Enable router-watchdog ==="

          echo "CONFIG_PACKAGE_router-watchdog=m" >> .config

          echo "=== Run defconfig ==="

          make defconfig

          echo "=== Verify package configuration ==="

          grep '^CONFIG_PACKAGE_router-watchdog=' .config

          echo "=== Build router-watchdog ==="

          echo "=== Build Entware host tools ==="

          export FORCE_UNSAFE_CONFIGURE=1

          make -j1 tools/tar/compile V=s

          echo "=== Install Entware host tools ==="

          make -j"$(nproc)" tools/install

          echo "=== Build Entware toolchain ==="

          make -j"$(nproc)" toolchain/install

          make package/router-watchdog/compile V=s

          echo "=== Find generated package ==="

          package=$(find bin \
            -type f \
            -name 'router-watchdog_*.ipk' \
            -print \
            -quit)

          echo "Selected package: [$package]"

          test -n "$package"

          echo "=== Copy package to workspace ==="

          mkdir -p /workspace/dist

          cp "$package" /workspace/dist/

          echo "=== Generated package ==="

          ls -lh /workspace/dist/

          echo "=== Entware build completed successfully ==="
          SCRIPT

          chmod +x build-entware.sh

          echo "=== Build script ==="
          cat build-entware.sh

      - name: Build .ipk
        run: |
          set -eux

          mkdir -p dist

          docker run --rm \
            --user root \
            -e GITHUB_WORKSPACE=/workspace \
            -v "$GITHUB_WORKSPACE:/workspace" \
            entware-builder \
            bash -euxo pipefail /workspace/build-entware.sh

      - name: Save Entware build cache
        if: always() && steps.entware-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: entware-cache.tar
          key: ${{ runner.os }}-entware-x64-3.2-${{ steps.entware-revisions.outputs.entware }}-${{ steps.entware-revisions.outputs.packages }}-${{ steps.entware-revisions.outputs.rustlang }}-${{ hashFiles('net/router-watchdog/Makefile', 'net/router-watchdog/files/**') }}

      - name: Verify package
        run: |
          set -eux

          echo "=== Package files ==="

          ls -lh dist/

          package_count=$(find dist \
            -maxdepth 1 \
            -type f \
            -name '*.ipk' \
            | wc -l)

          test "$package_count" -eq 1

          package=$(find dist \
            -maxdepth 1 \
            -type f \
            -name '*.ipk' \
            -print \
            -quit)

          echo "Package: $package"

          echo "=== IPK archive ==="

          tar -tzf "$package"

          echo "=== Package control metadata ==="

          tar -xOzf "$package" ./control.tar.gz \
            | tar -xOzf - ./control

      - name: Build feed
        run: |
          set -eux

          rm -rf feed

          mkdir -p feed/all

          cp dist/*.ipk feed/all/

          package=$(find feed/all \
            -maxdepth 1 \
            -type f \
            -name '*.ipk' \
            -print \
            -quit)

          filename=$(basename "$package")

          sha256=$(sha256sum "$package" | awk '{print $1}')

          size=$(stat -c '%s' "$package")

          control=$(mktemp)

          tar -xOzf "$package" ./control.tar.gz \
            | tar -xOzf - ./control \
            > "$control"

          cat "$control" > feed/all/Packages

          printf 'Filename: all/%s\n' \
            "$filename" \
            >> feed/all/Packages

          printf 'Size: %s\n' \
            "$size" \
            >> feed/all/Packages

          printf 'SHA256sum: %s\n\n' \
            "$sha256" \
            >> feed/all/Packages

          rm -f "$control"

          gzip -9 -c \
            feed/all/Packages \
            > feed/all/Packages.gz

          cp README.md feed/README.md

          echo "=== Feed contents ==="

          find feed \
            -maxdepth 2 \
            -type f \
            -print

          echo "=== Packages ==="

          cat feed/all/Packages

      - name: Verify feed metadata
        run: |
          set -eux

          gzip -t feed/all/Packages.gz

          grep -E '^Package: router-watchdog$' \
            feed/all/Packages

          grep -E '^Architecture: all$' \
            feed/all/Packages

          grep -E '^Filename: all/router-watchdog_' \
            feed/all/Packages

          grep -E '^Size: [0-9]+$' \
            feed/all/Packages

          grep -E '^SHA256sum: [0-9a-f]{64}$' \
            feed/all/Packages

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: router-watchdog-ipk
          path: dist/*.ipk
          if-no-files-found: error

      - name: Upload feed artifact
        uses: actions/upload-artifact@v6
        with:
          name: router-watchdog-feed
          path: feed/
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk

  publish-feed:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download feed artifact
        uses: actions/download-artifact@v7
        with:
          name: router-watchdog-feed
          path: feed

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: feed

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4