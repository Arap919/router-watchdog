name: Check package sources

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Python syntax
        run: |
          python3 -m py_compile net/router-watchdog/files/opt/libexec/router-watchdog/router_watchdog.py net/router-watchdog/files/opt/libexec/router-watchdog/merge_config.py net/router-watchdog/files/opt/libexec/router-watchdog/update_service.py scripts/build_package.py .github/scripts/select_release_build.py
          sh -n install.sh

      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.3

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check for Cyrillic in technical source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('net/router-watchdog/files/opt/libexec/router-watchdog/router_watchdog.py'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              if any('\u0400' <= ch <= '\u04ff' for ch in text):
                  raise SystemExit(f'Cyrillic characters found in {path}')
          PY

      - name: Check configuration keys
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('net/router-watchdog/files/opt/etc/router-watchdog.json').read_text())
          expected = {
              'controller', 'secret', 'target_group', 'benchmark_group', 'benchmark_proxy',
              'top_n', 'healthcheck_parallelism',
              'healthcheck_timeout_ms', 'speed_connect_timeout_seconds',
              'switch_wait_seconds', 'speed_test_url', 'download_bytes', 'parallel_streams',
              'multi_rounds', 'log_cleanup_days', 'schedule',
          }
          actual = set(config)
          if actual != expected:
              raise SystemExit(f'Unexpected config keys: {sorted(actual ^ expected)}')
          PY
