#====================================================
#                 CORE
#====================================================

port: 7890
socks-port: 7891
mixed-port: 1080
redir-port: 1182
tproxy-port: 1181

listeners:
  - name: benchmark-in
    type: http
    port: 17890
    listen: 0.0.0.0
    proxy: BENCHMARK
    users: []

allow-lan: true
bind-address: "*"

mode: rule
log-level: silent

ipv6: false
tcp-concurrent: true
unified-delay: true

find-process-mode: off

external-controller: 0.0.0.0:9090

external-ui: ./zash
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip

profile:
  store-selected: true
  store-fake-ip: true

#====================================================
#                 GEO DATA
#====================================================

geodata-mode: true
geo-auto-update: true
geo-update-interval: 168

geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geoip.dat
  geosite: https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat

#====================================================
#                 SNIFFER
#====================================================

sniffer:
  enable: true
  force-dns-mapping: true

  sniff:

    HTTP:
      ports: [80]
      override-destination: true

    TLS:
      ports: [443]

    QUIC:
      ports: [443]

#====================================================
#                 DNS
#====================================================

dns:
  enable: true

  listen: 0.0.0.0:7874

  ipv6: false

  use-hosts: true
  respect-rules: true

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  cache-algorithm: arc

  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8

  proxy-server-nameserver:
    - 1.1.1.1
    - 8.8.8.8

  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query

  fake-ip-filter-mode: blacklist

  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost"

    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.connectivitycheck.gstatic.com
    - +.detectportal.firefox.com

    - +.pool.ntp.org
    - +.ntp.org
    - +.time.windows.com
    - +.3gppnetwork.org
#====================================================
#              PROXY PROVIDERS
#====================================================

proxy-providers:

  BlancVPN:
    type: http
    url: YOUR_URL_HERE

    interval: 43200

    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      expected-status: 204

    header:
      User-Agent:
        - ClashMeta/1.19.24; mihomo/1.19.24
      x-hwid:
        - "322ABB229131"

    override:
      udp: true
      tfo: true

  PaperVPN:
    type: http
    url: YOUR_URL_HERE

    interval: 43200

    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      expected-status: 204

    override:
      udp: true
      tfo: true
#====================================================
#                 PROXY GROUPS
#====================================================

proxy-groups:

  - name: BENCHMARK
    type: select
    use:
      - BlancVPN
    hidden: true

  #
  # Источник прокси
  #
  - name: Proxy
    type: select
    use:
      - BlancVPN
      - PaperVPN

  #
  # Основной маршрут
  #
  - name: Global
    type: select
    proxies:
      - Proxy
      - DIRECT

  #
  # Российский трафик
  #
  - name: Russia
    type: select
    proxies:
      - DIRECT
      - Proxy

  #
  # Искусственный интеллект
